# --- k8s --------------------------------------------------------------------
# The five binaries below are not packages anywhere: the 'k8s' section
# downloads them, verifies their checksum and pins their version. They are
# listed here so the inventory is complete in one place and so
# --skip-tools reaches them like any other tool. Selecting them with
# --tools/--extras does nothing on its own: keep the 'k8s' section on.
kubectl|k8s|none|-|-|downloaded by the k8s section, sha256 verified|-
oc|k8s|none|-|-|OpenShift client, downloaded; the mirror publishes no checksum|-
kubectx|k8s|none|-|-|switch cluster, downloaded with kubens, sha256 verified|-
kubens|k8s|none|-|-|switch namespace, from the same release as kubectx|-
stern|k8s|none|-|-|multi-pod log tail, sha256 verified|-
k9s|k8s|pkg|-|pacman=k9s,dnf=k9s,brew=k9s,apt=-,apk=-|kubectl TUI; on Debian take it from the release page|-
helm|k8s|pkg|-|pacman=helm,apt=helm,dnf=helm,zypper=helm,apk=helm,brew=helm|kubernetes package manager|-
kustomize|k8s|pkg|-|pacman=kustomize,dnf=kustomize,brew=kustomize,zypper=kustomize,apt=-,apk=-|kustomize overlays|-
skaffold|k8s|pkg|-|pacman=skaffold,apt=skaffold,dnf=skaffold,zypper=skaffold,apk=skaffold,brew=skaffold|inner development loop|-
task|k8s|pkg|-|pacman=task,apt=task,dnf=task,zypper=task,apk=task,brew=task|Taskfile runner|-
crane|k8s|pkg|-|pacman=crane,apt=crane,dnf=crane,zypper=crane,brew=crane,apk=-|move images without a daemon|-
minikube|k8s|pkg|-|pacman=minikube,apt=minikube,dnf=minikube,zypper=minikube,brew=minikube,apk=-|local kubernetes cluster|-
lazydocker|k8s|pkg|-|pacman=lazydocker,apt=lazydocker,brew=lazydocker,zypper=lazydocker,apk=-|docker TUI|lazydocker

