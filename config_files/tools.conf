# =============================================================================
#  my-shell tool manifest
# =============================================================================
#  One tool per line, pipe-separated. This is data, not code: edit it to change
#  what a new machine gets without touching my-shell.sh.
#
#  id | group | method | arg | package mapping | note | probe
#
#  id
#      Unique name. This is what --tools=<id> and --skip-tools=<id> accept.
#
#  group
#      Used by --extras=<profile>. Each tool belongs to exactly one group.
#          deps      base requirements, installed by default
#          daily     everyday terminal drivers
#          k8s       kubernetes and cloud native
#          terminal  shells, history, prompt, session persistence
#          secrets   encryption and secret management
#          gui       graphical editors and desktop applications
#          ai        coding agents and assistants
#
#  method
#      pkg       resolve the package name from the mapping below
#      npm       npm install -g <arg>            needs npm on PATH
#      uv        uv tool install <arg>           needs uv or pipx
#      cargo     cargo install <arg>             needs a Rust toolchain
#      official  fetch and run an installer      arg = URL, needs curl
#      none      not a package. Listed so the inventory stays complete and
#                --skip-tools still reaches it, but a dedicated section
#                installs it with its own checksum and version pinning
#
#  package mapping
#      Comma-separated manager=package pairs. The first pair matching the
#      detected package manager wins. Use '-' to say "no package for this
#      manager". A tool with no usable entry is reported as unavailable rather
#      than failing the run, so an out-of-date mapping is never fatal.
#
#  probe
#      Comma-separated executable names, any of which counts as "this tool is
#      already installed". Defaults to the id when '-'. Needed because the
#      executable is not always the id: Debian ships fdfind, btop and codium.
#      Without it the script would reinstall the same tool on every run on
#      exactly the distributions where the name differs.
#
#  Nothing that requires an AUR PKGBUILD or a third-party repository belongs
#  here: those run arbitrary code and are opt-in through --aur.
# =============================================================================

# --- deps -------------------------------------------------------------------
# The script checks for these on its own. They are listed so that they can be
# requested by name with --tools= and so the expected set is documented.
git|deps|pkg|-|pacman=git,apt=git,dnf=git,zypper=git,apk=git,brew=git|version control|-
curl|deps|pkg|-|pacman=curl,apt=curl,dnf=curl,zypper=curl,apk=curl,brew=curl|downloads|-
unzip|deps|pkg|-|pacman=unzip,apt=unzip,dnf=unzip,zypper=unzip,apk=unzip,brew=unzip|font and theme archives|-

